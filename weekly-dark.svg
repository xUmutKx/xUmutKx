<title id="title">Weekly rhythm</title>
<desc id="desc">Contributions per weekday over the last 12 months (3,399 in total): Mon 492, Tue 466, Wed 312, Thu 257, Fri 789, Sat 752, Sun 331. Busiest: Fri. Quietest: Thu. On weekdays: 68%.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
